<!doctype html>
<html lang="es-BO">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Plataforma de gestión de atención médica ambulatoria: agendamiento de fichas, historia clínica digital y asistencia inteligente."
    />
    <meta name="color-scheme" content="light dark" />

    <!-- Figtree, con preconexión para que la fuente no llegue después del
         primer pintado y el texto no salte de tipografía a mitad de carga. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..700&display=swap"
      rel="stylesheet"
    />

    <!-- El tema antes de que cargue React, para no parpadear en claro al
         abrir en oscuro. Mismo criterio que src/tema/tema.ts. -->
    <script>
      try {
        var t = localStorage.getItem('tema') || 'sistema';
        if (t === 'oscuro' || (t === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>

    <title>Iniciar sesión · Centro Médico</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
