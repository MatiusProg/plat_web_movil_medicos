services:
  db:
    image: pgvector/pgvector:pg16
    container_name: plataforma_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local_pass
      POSTGRES_DB: plataforma
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Los scripts de esta carpeta se ejecutan UNA sola vez,
      # cuando el volumen se crea vacío. Si se modifican después,
      # hay que borrar el volumen: docker compose down -v
      - ./backend/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plataforma"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
